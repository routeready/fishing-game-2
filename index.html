<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REEL TROUBLE</title>
<style>
  html,body{margin:0;height:100%;background:#0a1316;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;touch-action:manipulation}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #hint{margin-top:10px;font-size:12px;color:#48666b;text-align:center;letter-spacing:1px}
  /* touch controls (body.touch is set by js/touch.js on coarse-pointer devices) */
  body.touch{padding-bottom:195px}
  @media (orientation:landscape){body.touch{padding-bottom:0}}
  body.touch #hint{display:none}
  #tc{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none;z-index:10}
  #tc>*{pointer-events:auto}
  .tbtn{display:flex;align-items:center;justify-content:center;background:#101820;border:1px solid #3a5a60;
        color:#cfe8e8;border-radius:8px;font-family:monospace;font-weight:bold;opacity:.88;
        touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .tbtn.on{background:#3a5a60;color:#fff}
  #dpad{display:grid;grid-template-areas:". u ." "l . r" ". d .";grid-auto-columns:50px;grid-auto-rows:50px;gap:4px}
  .d-u{grid-area:u}.d-l{grid-area:l}.d-r{grid-area:r}.d-d{grid-area:d}
  #acts{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:42px 42px 56px;gap:6px;justify-items:stretch}
  #acts .md{font-size:11px}
  #acts .sm{font-size:12px}
  #acts .big{grid-column:1/4;grid-row:3;font-size:16px;background:#16262c;border-color:#5a8a90;color:#ffd040}
  #acts .big.on{background:#5a8a90}
  #tmute{position:fixed;top:8px;right:8px;width:36px;height:36px;z-index:10}
  #tyn{position:fixed;left:50%;transform:translateX(-50%);bottom:185px;display:none;gap:10px;z-index:11}
  #tyn .tbtn{width:54px;height:44px;font-size:16px;background:#2a2410;border-color:#ffd040;color:#ffe080}
</style>
</head>
<body>
<canvas id="game" width="320" height="224"></canvas>
<div id="hint">ARROWS/WASD steer &amp; aim &middot; SPACE cast/strike/reel &middot; B crack a beer &middot; S lay low &middot; H hold my beer &middot; ESC pull anchor &middot; M mute</div>
<script src="js/util.js"></script>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/scene_menu.js"></script>
<script src="js/scene_boat.js"></script>
<script src="js/scene_fish.js"></script>
<script src="js/main.js"></script>
<script src="js/touch.js"></script>
</body>
</html>
