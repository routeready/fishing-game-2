<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REEL TROUBLE</title>
<style>
  html,body{margin:0;height:100%;background:#0a1316;overflow:hidden}
  /* touch-action doesn't inherit: cover every element so rapid taps never double-tap-zoom */
  *{touch-action:manipulation}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;user-select:none;-webkit-user-select:none}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #hint{margin-top:10px;font-size:12px;color:#48666b;text-align:center;letter-spacing:1px}
  /* touch controls (body.touch is set by js/touch.js on coarse-pointer devices) */
  body.touch{padding-bottom:165px}
  @media (orientation:landscape){body.touch{padding-bottom:0}}
  body.touch #hint{display:none}
  #tc{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));pointer-events:none;z-index:10}
  #tc>*{pointer-events:auto}
  .tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#101820;border:1px solid #3a5a60;
        color:#cfe8e8;border-radius:8px;font-family:monospace;font-weight:bold;opacity:.88;line-height:1.15;
        touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .tbtn .thint{font-size:8px;font-weight:normal;color:#7fa0a6;letter-spacing:0;white-space:nowrap}
  .tbtn.on{background:#3a5a60;color:#fff}
  #dpad{display:grid;grid-template-areas:". u ." "l . r" ". d .";grid-auto-columns:42px;grid-auto-rows:42px;gap:4px}
  .d-u{grid-area:u}.d-l{grid-area:l}.d-r{grid-area:r}.d-d{grid-area:d}
  #acts{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:36px 36px 52px;gap:5px;justify-items:stretch}
  #acts .md{font-size:10px}
  #acts .w2{grid-column:span 2}
  #acts .sm{font-size:11px}
  #acts .thint{font-size:7px}
  #acts .big{grid-column:1/4;grid-row:3;font-size:16px;background:#16262c;border-color:#5a8a90;color:#ffd040}
  #acts .big.on{background:#5a8a90}
  #tgas{width:62px;height:96px;font-size:15px;background:#16262c;border-color:#5a8a90;color:#8f8}
  #tgas .thint{font-size:7px}
  #tgas.on{background:#5a8a90;color:#fff}
  /* landscape: keep the action cluster off the play area, beside GAS */
  @media (orientation:landscape){
    .tbtn{opacity:.5}.tbtn.on{opacity:.95}
    #acts{position:fixed;right:84px;bottom:calc(8px + env(safe-area-inset-bottom))}
  }
  /* tiny phones (iPhone SE, fold covers): shrink so nothing clips */
  @media (max-width:350px){
    #dpad{grid-auto-columns:38px;grid-auto-rows:38px}
    #acts{grid-template-columns:repeat(3,42px);grid-template-rows:34px 34px 46px}
    #tgas{width:54px;height:88px}
  }
  #tmute{position:fixed;top:8px;right:8px;width:36px;height:36px;z-index:10}
  #tyn{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;display:none;gap:10px;z-index:11}
  #tyn .tbtn{width:54px;height:44px;font-size:16px;background:#2a2410;border-color:#ffd040;color:#ffe080}
  /* name gate (js/name.js) */
  #namegate{position:fixed;inset:0;background:rgba(6,12,14,.93);display:flex;align-items:center;justify-content:center;z-index:30}
  #namegate .nbox{background:#101820;border:1px solid #3a5a60;border-radius:10px;padding:22px 26px;
                  display:flex;flex-direction:column;gap:14px;align-items:center}
  #namegate .ntitle{color:#ffd040;font-size:15px;font-weight:bold;letter-spacing:2px}
  #namegate input{background:#0a1316;border:1px solid #3a5a60;color:#cfe8e8;font-family:monospace;font-size:18px;
                  padding:8px 10px;width:170px;text-align:center;text-transform:uppercase;border-radius:6px;outline:none}
  #namegate input:focus{border-color:#5a8a90}
  #namegate button{background:#16262c;border:1px solid #5a8a90;color:#ffd040;font-family:monospace;font-weight:bold;
                   font-size:15px;padding:10px 28px;border-radius:8px}
</style>
</head>
<body>
<script>
// Self-heal stale caches: if boot crashes (mixed old/new files right
// after a deploy), force one reload with a cache-busting query.
window.addEventListener('error', function () {
  try {
    if (window.RT && RT.G && RT.G.t > 3) return; // game was running fine
    if (sessionStorage.getItem('rtReboot')) return;
    sessionStorage.setItem('rtReboot', '1');
    location.replace(location.pathname + '?r=' + Date.now());
  } catch (e) { /* best effort */ }
});
setTimeout(function () { try { sessionStorage.removeItem('rtReboot'); } catch (e) {} }, 4000);
</script>
<canvas id="game" width="320" height="224"></canvas>
<div id="hint">ARROWS/WASD steer &amp; aim &middot; SPACE cast/strike/reel &middot; B crack a beer &middot; S lay low &middot; H hold my beer &middot; ESC pull anchor &middot; M mute</div>
<script src="js/util.js"></script>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/scene_menu.js"></script>
<script src="js/scene_boat.js"></script>
<script src="js/scene_fish.js"></script>
<script src="js/main.js"></script>
<script src="js/touch.js"></script>
<script src="js/name.js"></script>
</body>
</html>
