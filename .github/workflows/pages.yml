name: Publish to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          mkdir -p /tmp/site
          cp index.html /tmp/site/
          cp -r js /tmp/site/
          # cache-bust: stamp script URLs per deploy so phones never mix
          # old and new js files
          sed -i "s|src=\"js/\([a-z_]*\)\.js\"|src=\"js/\1.js?v=${GITHUB_SHA::8}\"|g" /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
